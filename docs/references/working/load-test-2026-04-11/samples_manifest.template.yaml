# samples_manifest.yaml — Template
#
# Copy this to samples_manifest.yaml and fill in your sample metadata.
# samples_manifest.yaml IS committed; sample files are NOT.

schema_version: "v1"
manifest_version: "2026-04-11"

# Path to the schema_ir JSON file used for all samples.
# Relative to this manifest file.
schema_ir_path: "./test_schema_ir.json"

# AgentScope configuration for all samples.
scope:
  agent_id: "b3_load_test"
  max_batch_size: 100
  min_confidence: 0.0
  require_source: false
  allowed_entity_types: null     # null = allow all
  allowed_pred_ids: null          # null = allow all
  allow_document_ingest: true

# ExtractionConfig for all samples.
# Can be overridden per-sample via `extraction_config_override`.
extraction_config:
  model: "gpt-4o-mini"
  max_retries: 2
  temperature: 0.0
  max_text_chars: 4000
  timeout_seconds: 30.0

# BatchExtractionConfig for all samples.
batch_config:
  max_segments_per_batch: 1000
  early_stop_on_batch_cap_reached: true

# ResolutionConfig for all samples.
resolution_config:
  enable_dedupe: true
  max_input_specs: 10000

# Optional Langfuse config for tracing.
# Keys read from environment variables:
#   LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY
# Set enabled: false to skip tracer even if keys are present.
langfuse:
  enabled: true
  host: null                      # null = default cloud

# Sample definitions.
# Each sample triggers one run through the full pipeline.
samples:
  - sample_id: "short_01_pdf"
    path: "samples/short/short_01_pdf.pdf"
    doc_type: "pdf"
    length_class: "short"          # short | medium | long
    domain: "regulation"           # regulation | contract | spec | narrative | scanned | other
    expected_result: "success"     # success | empty | staging_error | extraction_error
    expected_min_valid_specs: 1    # ignored if expected_result != "success"
    notes: "Short PDF with clear if-then clauses"

  - sample_id: "short_02_txt"
    path: "samples/short/short_02_txt.txt"
    doc_type: "txt"
    length_class: "short"
    domain: "regulation"
    expected_result: "success"
    expected_min_valid_specs: 1
    notes: "Plain text regulations"

  - sample_id: "medium_01_regulation"
    path: "samples/medium/medium_01_regulation.pdf"
    doc_type: "pdf"
    length_class: "medium"
    domain: "regulation"
    expected_result: "success"
    expected_min_valid_specs: 5
    notes: "Medium regulation PDF, mixed if-then and definitions"

  - sample_id: "medium_02_contract"
    path: "samples/medium/medium_02_contract.docx"
    doc_type: "docx"
    length_class: "medium"
    domain: "contract"
    expected_result: "success"
    expected_min_valid_specs: 3
    notes: "Contract with tables and headings"

  - sample_id: "medium_03_spec"
    path: "samples/medium/medium_03_spec.md"
    doc_type: "md"
    length_class: "medium"
    domain: "spec"
    expected_result: "success"
    expected_min_valid_specs: 3
    notes: "Technical spec, entity_relation heavy"

  - sample_id: "medium_04_narrative"
    path: "samples/medium/medium_04_narrative.pdf"
    doc_type: "pdf"
    length_class: "medium"
    domain: "narrative"
    expected_result: "success"
    expected_min_valid_specs: 0    # narrative 可能提取不到
    notes: "Narrative document; low structural_clarity expected"

  - sample_id: "long_01_policy"
    path: "samples/long/long_01_policy.pdf"
    doc_type: "pdf"
    length_class: "long"
    domain: "regulation"
    expected_result: "success"
    expected_min_valid_specs: 10
    notes: "Long policy document with clear structure"

  - sample_id: "long_02_handbook"
    path: "samples/long/long_02_handbook.docx"
    doc_type: "docx"
    length_class: "long"
    domain: "spec"
    expected_result: "success"
    expected_min_valid_specs: 5
    notes: "Handbook with nested sections"

  - sample_id: "scanned_01"
    path: "samples/expected_failure/scanned_01.pdf"
    doc_type: "pdf"
    length_class: "short"
    domain: "scanned"
    expected_result: "staging_error"
    expected_error_kind: "empty_document"
    notes: "Scanned PDF with no extractable text; should fail staging"
