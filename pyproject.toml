[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factgraph"
version = "0.2.0rc1"
description = "FactGraph package for append-only facts, policy/view projection, and logic export."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = ["pydantic>=2", "diskcache>=5", "build>=1.5.0,<2"]

[project.optional-dependencies]
dev = ["ruff>=0.15,<1", "mypy>=1.20,<2", "coverage[toml]>=7,<8"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["factgraph*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["src/factgraph", "src/service"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
factgraph = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
build = "python -m build"

[tool.pixi.dependencies]
python = ">=3.14.6,<3.15"
pip = ">=26.1.2,<27"
