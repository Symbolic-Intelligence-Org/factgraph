[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factpy-kernel"
version = "0.1.0"
description = "FactPy kernel for append-only facts, policy/view projection, and logic export."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = ["pydantic>=2", "diskcache>=5"]

[project.optional-dependencies]
service = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1", "python-multipart>=0.0.5"]
documents = ["pymupdf>=1.24", "pymupdf4llm>=0.0.17", "python-docx>=1.1"]
extraction = ["instructor>=1.6", "litellm>=1.50", "mistralai>=1,<2"]
observability = ["langfuse>=2.0"]
dev = ["ruff>=0.15,<1", "mypy>=1.20,<2", "coverage[toml]>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["src/kernel", "src/service"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
