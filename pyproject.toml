[project]
dependencies = ["httpx>=0.28.1,<0.29", "fastapi>=0.136.1,<0.137", "networkx>=3.6.1,<4"]
name = "factgraph"
description = ""
requires-python = ">= 3.11"
dynamic = ["version"]
readme = "README.md"

keywords = ["knowledge-graph", "symbolic-reasoning", "rule-engine", "inference", "provenance", "explainability", "audit"]

maintainers = [
  {name = "Zhenzhi Li", email = "z.li@symbolic-intelligence.de"},
  {name = "Raphael Feikert et al.", email = "r.feikert@symbolic-intelligence.de"},

]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/factgraph"]

[project.urls]
Homepage = "https://symbolic-intelligence.de"
Documentation = "https://factgraph.docs.symbolic-intelligence.de"
Repository = "https://github.com/Symbolic-Intelligence-Org/factgraph"
Issues = "https://github.com/Symbolic-Intelligence-Org/factgraph/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
factgraph = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
build = { features = ["build"], no-default-feature = true }
publish = { features = ["publish"], no-default-feature = true }

[tool.pixi.feature.test.tasks]
test = "pytest tests/*.py"

[tool.pixi.feature.build.tasks]
build = { cmd = "python -m build", depends-on = ["test"] }

[tool.pixi.feature.build.dependencies]
python = "*"

[tool.pixi.feature.publish.tasks]
publish-to-pypi = { cmd = "python -m twine upload --repository testpypi dist/*", depends-on = ["build"] }

[tool.pixi.feature.publish.dependencies]
python = "*"

[dependency-groups]
test = ["pytest>=9.0.3,<10"]
build = ["build", "hatch-vcs>=0.5.0,<0.6"]
publish = ["twine"]
