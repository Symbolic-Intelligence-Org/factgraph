[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factpy-kernel"
version = "0.1.0"
description = "FactPy kernel for append-only facts, policy/view projection, and logic export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "diskcache>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factpy_kernel = ["samples/*.csv", "examples/*.py"]
