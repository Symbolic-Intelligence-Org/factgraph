[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factgraph"
version = "0.3.0"
description = "FactGraph package for append-only facts, policy/view projection, and logic export."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = ["pydantic>=2", "diskcache>=5"]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7,<8",
    "mypy>=1.20,<2",
    "networkx>=3,<4",
    "pytest>=8,<9",
    "ruff>=0.15,<0.16",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["factgraph*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["src/factgraph"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
