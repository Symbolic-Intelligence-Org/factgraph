name: factpy-kernel-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package (all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[extraction,documents,service,observability]"

      - name: Test (where AST gate on, 5 dirs)
        run: |
          python -m unittest discover -s src/kernel/tests -p 'test_*.py'
          python -m unittest discover -s src/agent/tests -p 'test_*.py'
          python -m unittest discover -s src/service/tests -p 'test_*.py'
          python -m unittest discover -s src/domains/ecss/tests -p 'test_*.py'
          python -m unittest discover -s tools/benchmarks/tests -p 'test_*.py'

      - name: Test (where AST gate off compatibility, 5 dirs)
        env:
          FACTPY_WHERE_AST_VALIDATE: "0"
        run: |
          python -m unittest discover -s src/kernel/tests -p 'test_*.py'
          python -m unittest discover -s src/agent/tests -p 'test_*.py'
          python -m unittest discover -s src/service/tests -p 'test_*.py'
          python -m unittest discover -s src/domains/ecss/tests -p 'test_*.py'
          python -m unittest discover -s tools/benchmarks/tests -p 'test_*.py'

      - name: Test (strict profile smoke)
        run: |
          if find src/kernel/tests src/agent/tests src/service/tests src/domains/ecss/tests tools/benchmarks/tests -maxdepth 1 -type f -name 'test_*strict*.py' 2>/dev/null | grep -q .; then
            for d in src/kernel/tests src/agent/tests src/service/tests src/domains/ecss/tests tools/benchmarks/tests; do
              python -m unittest discover -s "$d" -p 'test_*strict*.py'
            done
          else
            echo "No strict profile smoke tests found across the 5 test directories; skipping."
          fi
