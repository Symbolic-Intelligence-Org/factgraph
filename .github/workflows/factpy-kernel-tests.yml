name: factpy-kernel-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test (where AST gate on)
        run: python -m unittest discover -s src/factpy_kernel/tests -p 'test_*.py'

      - name: Test (where AST gate off compatibility)
        run: FACTPY_WHERE_AST_VALIDATE=0 python -m unittest discover -s src/factpy_kernel/tests -p 'test_*.py'

      - name: Test (strict profile smoke)
        run: |
          if find src/factpy_kernel/tests -maxdepth 1 -type f -name 'test_*strict*.py' | grep -q .; then
            python -m unittest discover -s src/factpy_kernel/tests -p 'test_*strict*.py'
          else
            echo "No strict profile smoke tests found under src/factpy_kernel/tests; skipping."
          fi

      - name: Install service extra
        run: pip install -e ".[service]"

      - name: Test (service routes)
        run: |
          if [ -f src/factpy_kernel/tests/test_service_v1_routes.py ]; then
            python -m unittest -q src.factpy_kernel.tests.test_service_v1_routes
          else
            echo "No service route tests found under src/factpy_kernel/tests; skipping."
          fi
